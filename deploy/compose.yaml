name: ${COMPOSE_PROJECT_NAME:-osimi-archive}

x-api-image: &api-image
  image: osimi-archive-api:${IMAGE_TAG:-latest}
  build:
    context: ..
    dockerfile: Dockerfile

x-container-hardening: &container-hardening
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  api:
    <<: [*api-image, *container-hardening]
    restart: unless-stopped
    stop_grace_period: 70s
    mem_limit: ${API_MEMORY_LIMIT:-1g}
    cpus: ${API_CPUS:-1.0}
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "3"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DB_SCHEMA: ${DB_SCHEMA:-public}
      STAGING_ROOT: /var/lib/osimi/staging
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in deploy/.env}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-2147483648}
      MAX_ARTIFACT_SEARCH_TEXT_BYTES: ${MAX_ARTIFACT_SEARCH_TEXT_BYTES:-10485760}
      ARTIFACT_FINALIZATION_INTERVAL_SECONDS: ${ARTIFACT_FINALIZATION_INTERVAL_SECONDS:-30}
      ARTIFACT_FINALIZATION_BATCH_SIZE: ${ARTIFACT_FINALIZATION_BATCH_SIZE:-25}
      ARTIFACT_FINALIZATION_CLAIM_TIMEOUT_SECONDS: ${ARTIFACT_FINALIZATION_CLAIM_TIMEOUT_SECONDS:-300}
      DATABASE_URL_FILE: /run/secrets/database_url
      UPLOAD_SIGNING_SECRET_FILE: /run/secrets/upload_signing_secret
      LEASE_SIGNING_SECRET_FILE: /run/secrets/lease_signing_secret
      WORKER_AUTH_TOKEN_FILE: /run/secrets/worker_auth_token
    secrets:
      - database_url
      - upload_signing_secret
      - lease_signing_secret
      - worker_auth_token
    volumes:
      - type: bind
        source: ${STAGING_HOST_PATH:?Set STAGING_HOST_PATH in deploy/.env}
        target: /var/lib/osimi/staging
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks:
      proxy:
        aliases:
          - osimi-api
      database: {}
      stack: {}
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - const r=await fetch('http://127.0.0.1:3000/readyz');if(!r.ok)process.exit(1)
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

  ui:
    <<: *container-hardening
    image: osimi-archive-ui:${IMAGE_TAG:-latest}
    build:
      context: ../../osimi-archive-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: ${UI_MEMORY_LIMIT:-512m}
    cpus: ${UI_CPUS:-0.75}
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "3"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in deploy/.env}
      PRIVATE_API_BASE: http://api:3000
      PUBLIC_API_BASE: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in deploy/.env}
      APP_BUILD_ID: ${APP_BUILD_ID:-docker}
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    depends_on:
      api:
        condition: service_healthy
    networks:
      proxy:
        aliases:
          - osimi-ui
      stack: {}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

  migrate:
    <<: [*api-image, *container-hardening]
    profiles:
      - tools
    restart: "no"
    mem_limit: ${MIGRATION_MEMORY_LIMIT:-1g}
    cpus: ${MIGRATION_CPUS:-1.0}
    pids_limit: 256
    command:
      - bun
      - run
      - migrate
    environment:
      DB_SCHEMA: ${DB_SCHEMA:-public}
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    networks:
      database: {}

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK in deploy/.env}
  database:
    external: true
    name: ${POSTGRES_NETWORK:?Set POSTGRES_NETWORK in deploy/.env}
  stack:
    internal: true

secrets:
  database_url:
    file: ${SECRETS_DIR:-./secrets}/database_url
  upload_signing_secret:
    file: ${SECRETS_DIR:-./secrets}/upload_signing_secret
  lease_signing_secret:
    file: ${SECRETS_DIR:-./secrets}/lease_signing_secret
  worker_auth_token:
    file: ${SECRETS_DIR:-./secrets}/worker_auth_token
